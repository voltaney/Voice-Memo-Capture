[package]
name = "voicehook"
# リリースのバージョンはここが正本。タグ `vX.Y.Z` と一致させる
# （不一致なら GitHub Actions のリリースが失敗する）。exe のバージョン情報にも埋め込まれる。
version = "0.2.0"
edition = "2024"
description = "起動すると即録音、ボタン一つでWebhookへ送信するWindows用の音声メモツール"
repository = "https://github.com/voltaney/VoiceHook"

# exe のファイル名を `VoiceHook.exe` にする（パッケージ名は小文字が慣例のため分ける）。
[[bin]]
name = "VoiceHook"
path = "src/main.rs"

[dependencies]
# 録音・デバイス列挙
cpal = "0.18.1"
# WAV 書出し
hound = "3.5.1"
# ウィンドウUI（retained-mode。ソフトウェアレンダラでGPU初期化不要＝起動が軽い）
slint = { version = "1.17", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }
# Webhook への blocking POST（Basic認証は basic_auth に委譲）
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
# .env 読込
dotenvy = "0.15.7"
# Opus エンコード（libopus の安全バインディング。audiopus_sys が libopus を同梱ビルドする）
audiopus = "0.2.0"
# Ogg コンテナへの多重化（OpusHead / OpusTags / 音声パケットをページに束ねる）
ogg = "0.9.2"

# メインモニタのサイズ取得（ウィンドウ中央配置用の GetSystemMetrics）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# ui/app.slint をビルド時にRustコードへコンパイルする
slint-build = "1.17"
# exe に アプリアイコン（assets/icon.ico）を埋め込む
winresource = "0.1"
