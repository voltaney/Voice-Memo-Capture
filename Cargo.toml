[package]
name = "voice-memo-capture"
version = "0.1.0"
edition = "2024"

[dependencies]
# 録音・デバイス列挙
cpal = "0.18.1"
# WAV 書出し
hound = "3.5.1"
# ウィンドウUI（egui + winit + レンダラを同梱）
eframe = "0.35.0"
# n8n Webhook への blocking POST（Basic認証は basic_auth に委譲）
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
# .env 読込
dotenvy = "0.15.7"
